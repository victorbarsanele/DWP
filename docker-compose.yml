services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      timeout: 3s
      retries: 15

  localstack:
    image: localstack/localstack:3.8.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      LS_LOG: warn
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 3s
      retries: 15
